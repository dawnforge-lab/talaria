name: Release

# A tag like v1.2.0 builds a signed release APK and attaches it to that tag's GitHub release. The
# APK has no Firebase settings, so notifications are off in it: push needs an app built with your
# own Firebase project and a relay for it (docs/building.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TALARIA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the TALARIA_KEYSTORE_BASE64, TALARIA_KEYSTORE_PASSWORD, TALARIA_KEY_ALIAS and TALARIA_KEY_PASSWORD secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        env:
          TALARIA_KEYSTORE: ${{ runner.temp }}/release.jks
          TALARIA_KEYSTORE_PASSWORD: ${{ secrets.TALARIA_KEYSTORE_PASSWORD }}
          TALARIA_KEY_ALIAS: ${{ secrets.TALARIA_KEY_ALIAS }}
          TALARIA_KEY_PASSWORD: ${{ secrets.TALARIA_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Ptalaria.versionName="${GITHUB_REF_NAME#v}" \
            -Ptalaria.versionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "talaria-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "talaria-${GITHUB_REF_NAME}.apk" --verify-tag --generate-notes --title "Talaria ${GITHUB_REF_NAME}"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
